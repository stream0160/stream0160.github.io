<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>综合练习 - 动态菜单与轮播</title>
    <style>
        .active {
            background-color: red;
        }
        #nav {
            position: fixed;
            right: 0;
            top: 20px;
            background: white;
            padding: 10px;
            list-style: none;
            border: 1px solid #ccc;
            z-index: 100;
        }
        #nav li {
            margin: 5px 0;
        }
        #nav a {
            text-decoration: none;
            padding: 4px 8px;
            display: block;
        }
        
        #container {
            position: relative;
            width: 600px;
            height: 400px;
            border: 3px solid #333;
            overflow: hidden;
            margin: 20px auto;
        }
        #list {
            position: absolute;
            z-index: 1;
            width: 2400px;
            height: 400px;
            left: 0px;
        }
        #list img {
            float: left;
            width: 600px;
            height: 400px;
        }
        #buttons {
            position: absolute;
            left: 250px;
            bottom: 20px;
            z-index: 2;
            height: 10px;
            width: 100px;
        }
        #buttons span {
            float: left;
            margin-right: 5px;
            width: 10px;
            height: 10px;
            border: 1px solid #fff;
            border-radius: 50%;
            background: #333;
            cursor: pointer;
        }
        #buttons .on {
            background: orangered;
        }
        .arrow {
            position: absolute;
            top: 180px;
            z-index: 2;
            display: none;
            width: 40px;
            height: 40px;
            font-size: 36px;
            font-weight: bold;
            line-height: 39px;
            text-align: center;
            color: #fff;
            background-color: RGBA(0, 0, 0, .3);
            cursor: pointer;
            text-decoration: none;
        }
        .arrow:hover {
            background-color: RGBA(0, 0, 0, .7);
        }
        #container:hover .arrow {
            display: block;
        }
        #prev {
            left: 20px;
        }
        #next {
            right: 20px;
        }
        
        .content-block {
            margin: 50px 100px;
            padding: 20px;
            border-bottom: 1px solid #ddd;
        }
        h1.title {
            font-size: 24px;
            margin: 20px 0;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

<div id="container">
    <div id="list">
        <img src="rei.gif" alt="1" />
        <img src="bg.jpg" alt="2" />
        <img src="miku.jpg" alt="3" />
        <img src="mio.jpg" alt="4" />
    </div>
    <div id="buttons">
        <span index="1" class="on"></span>
        <span index="2"></span>
        <span index="3"></span>
        <span index="4"></span>
    </div>
    <a href="javascript:;" id="prev" class="arrow">&lt;</a>
    <a href="javascript:;" id="next" class="arrow">&gt;</a>
</div>

<div class="content-block">
    <h1 class="title" id="section1">Web 概述</h1>
    <p>Web 概述内容：万维网、HTTP、URL 等基本概念。</p>
</div>
<div class="content-block">
    <h1 class="title" id="section2">HTML 基础</h1>
    <p>HTML 是超文本标记语言，用于构建网页结构。</p>
</div>
<div class="content-block">
    <h1 class="title" id="section3">CSS 样式</h1>
    <p>CSS 用于控制网页样式与布局，实现美观界面。</p>
</div>
<div class="content-block">
    <h1 class="title" id="section4">JavaScript 核心</h1>
    <p>JavaScript 赋予网页交互能力，是前端核心语言。</p>
</div>
<div class="content-block">
    <h1 class="title" id="section5">Node.js 后端</h1>
    <p>Node.js 让 JavaScript 运行在服务器端，构建高性能应用。</p>
</div>

<script>
    let width = 600;
    let list = document.getElementById("list");
    let prev = document.getElementById("prev");
    let next = document.getElementById("next");
    let num = list.children.length; 
    let buttons = document.getElementById("buttons").getElementsByTagName("span");
    let currentIndex = 0;           
    let autoTimer = null;            

    function animate(offset) {
        let left = parseInt(getComputedStyle(list).left);
        let newLeft = left - offset * width;
        list.style.left = newLeft + "px";
        if (newLeft <= -num * width) {
            list.style.left = "0px";
        }
        if (newLeft > 0) {
            list.style.left = -(num - 1) * width + "px";
        }
        let currentLeft = parseInt(getComputedStyle(list).left);
        let index = Math.abs(currentLeft / width) % num;
        currentIndex = Math.round(index);
        setButtonHighlight(currentIndex);
    }

    function setButtonHighlight(idx) {
        for (let i = 0; i < buttons.length; i++) {
            if (i === idx) {
                buttons[i].className = "on";
            } else {
                buttons[i].className = "";
            }
        }
    }

    function goToSlide(index) {
        if (index < 0) index = 0;
        if (index >= num) index = num - 1;
        let targetLeft = -index * width;
        list.style.left = targetLeft + "px";
        currentIndex = index;
        setButtonHighlight(currentIndex);
    }

    prev.onclick = function () {
        animate(-1);
        resetAutoPlay();   
    };
    next.onclick = function () {
        animate(1);
        resetAutoPlay();
    };

    for (let i = 0; i < buttons.length; i++) {
        buttons[i].onclick = (function(idx) {
            return function() {
                goToSlide(idx);
                resetAutoPlay();
            };
        })(i);
    }

    function startAutoPlay() {
        if (autoTimer) clearInterval(autoTimer);
        autoTimer = setInterval(function() {
            animate(1);
        }, 3000); 
    }

    function resetAutoPlay() {
        if (autoTimer) {
            clearInterval(autoTimer);
            startAutoPlay();
        }
    }

    function initCarousel() {
        setButtonHighlight(0);
        startAutoPlay();
    }
    initCarousel();


    let titles = document.getElementsByClassName("title");
    if (titles.length > 0) {
        let oldNav = document.getElementById("nav");
        if (oldNav) oldNav.remove();
        
        let navUl = document.createElement("ul");
        navUl.id = "nav";
        document.body.appendChild(navUl);
        
        for (let i = 0; i < titles.length; i++) {
            let title = titles[i];
            let id = title.id;
            if (!id) {
                id = "auto-title-" + i;
                title.id = id;
            }
            let li = document.createElement("li");
            let a = document.createElement("a");
            a.href = "#" + id;
            a.textContent = title.textContent || "标题" + (i+1);
            a.onclick = function(e) {
                e.preventDefault();
                let target = document.getElementById(id);
                if (target) {
                    target.scrollIntoView({ behavior: "smooth", block: "start" });
                    setTimeout(updateActiveMenu, 100);
                }
            };
            li.appendChild(a);
            navUl.appendChild(li);
        }
        

        let navLinks = document.querySelectorAll("#nav a");
        
        function updateActiveMenu() {
            let scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
            let innerHeight = window.innerHeight;
            let activeIndex = -1;
            for (let i = titles.length - 1; i >= 0; i--) {
                let offsetTop = titles[i].offsetTop;
                if (offsetTop <= scrollTop + innerHeight / 2) {
                    activeIndex = i;
                    break;
                }
            }   
                    if (activeIndex === -1 && titles.length > 0) {
                activeIndex = 0;
            }
            for (let i = 0; i < navLinks.length; i++) {
                let link = navLinks[i];
                let href = link.getAttribute("href");
                if (href) {
                    let targetId = href.substring(1);
                    if (activeIndex !== -1 && titles[activeIndex] && titles[activeIndex].id === targetId) {
                        link.className = "active";
                    } else {
                        link.className = "";
                    }
                }
            }
        }
        
        window.addEventListener("scroll", updateActiveMenu);
        window.addEventListener("resize", updateActiveMenu);
        updateActiveMenu(); 
    }
</script>

</body>
</html>
